# Traefik для minikube: HTTP :80 на hostPort, без TLS.
# JWT не валидирует — только маршрутизация public API (см. Архитектура/ApiGateway.md).

deployment:
  kind: DaemonSet

hostNetwork: false

ports:
  web:
    port: 8000
    exposedPort: 80
    hostPort: 80
    expose:
      default: true
    protocol: TCP
  websecure:
    expose:
      default: false

providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
    allowExternalNameServices: true
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

logs:
  general:
    level: INFO
  access:
    enabled: true
    fields:
      headers:
        names:
          X-Request-ID: keep

experimental:
  plugins:
    requestid:
      moduleName: github.com/jeroentrappers/traefik-plugin-request-id
      version: v0.1.0

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  type: ClusterIP
