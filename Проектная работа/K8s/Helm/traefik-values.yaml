# Traefik для minikube: HTTP :80 на hostPort, без TLS.
# JWT не валидирует — только маршрутизация public API (см. Архитектура/ApiGateway.md).

deployment:
  kind: DaemonSet

# Minikube состоит из одного узла, а Traefik занимает hostPort 80.
# Второй pod нельзя запустить параллельно со старым во время обновления.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

hostNetwork: false

ports:
  web:
    port: 8000
    exposedPort: 80
    hostPort: 80
    expose:
      default: true
    protocol: TCP
  websecure:
    expose:
      default: false

providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
    allowExternalNameServices: true
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

log:
  level: INFO

accessLog:
  enabled: true
  fields:
    headers:
      names:
        X-Request-ID: keep

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  spec:
    type: ClusterIP
