{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalog-service.fullname" . }}
  labels:
    {{- include "catalog-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      {{- include "catalog-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "catalog-service.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.deployment.imageRepository }}:{{ .Values.deployment.imageTag }}
          startupProbe:
            httpGet:
              path: /health/startup
              port: {{ .Values.deployment.port }}
            periodSeconds: {{ .Values.deployment.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.deployment.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.deployment.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.deployment.port }}
            periodSeconds: {{ .Values.deployment.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.deployment.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.deployment.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.deployment.readinessProbe.successThreshold }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.deployment.port }}
            periodSeconds: {{ .Values.deployment.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.deployment.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.deployment.livenessProbe.failureThreshold }}
          env:
            - name: DB_PRIMARY_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_PRIMARY_HOST
            - name: DB_PRIMARY_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_PRIMARY_PORT
            - name: DB_PRIMARY_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_PRIMARY_NAME
            - name: DB_REPLICA_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_REPLICA_HOST
            - name: DB_REPLICA_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_REPLICA_PORT
            - name: DB_REPLICA_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_REPLICA_NAME
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: ASPNETCORE_ENVIRONMENT
            - name: Auth__Url
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: Auth__Url
            - name: Redis__Configuration
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: Redis__Configuration
            - name: Redis__InstanceName
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: Redis__InstanceName
            - name: Kafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: Kafka__BootstrapServers
            - name: Kafka__GroupId
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: Kafka__GroupId
            {{- range $i, $_ := .Values.config.kafkaTopics }}
            - name: Kafka__Topics__{{ $i }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" $ }}
                  key: Kafka__Topics__{{ $i }}
            {{- end }}
            - name: Kafka__Acks
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: Kafka__Acks
            - name: Kafka__EnableIdempotence
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: Kafka__EnableIdempotence
            - name: Catalog__LowStockThreshold
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: Catalog__LowStockThreshold
            - name: Catalog__BrandsCacheTtl
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: Catalog__BrandsCacheTtl
            - name: Catalog__CategoriesCacheTtl
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: Catalog__CategoriesCacheTtl
            - name: DB_PRIMARY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_PRIMARY_USER
            - name: DB_PRIMARY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_PRIMARY_PASSWORD
            - name: DB_REPLICA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_REPLICA_USER
            - name: DB_REPLICA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_REPLICA_PASSWORD
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.deployment.port }}"
          ports:
            - containerPort: {{ .Values.deployment.port }}
              protocol: {{ .Values.service.protocol }}
              name: {{ .Values.service.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.deployment.maxSurge }}
      maxUnavailable: {{ .Values.deployment.maxUnavailable }}
{{- end }}
