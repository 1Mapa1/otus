{{- if and .Values.enabled .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "catalog-service.fullname" . }}-migration
  labels:
    {{- include "catalog-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: {{ .Values.migrationJob.ttlSecondsAfterFinished }}
  completions: 1
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    spec:
      containers:
        - name: {{ .Values.name }}-migration
          image: {{ .Values.migrationJob.imageRepository }}:{{ .Values.migrationJob.imageTag }}
          imagePullPolicy: {{ .Values.migrationJob.imagePullPolicy | default "Always" }}
          env:
            - name: DB_PRIMARY_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_PRIMARY_HOST
            - name: DB_PRIMARY_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_PRIMARY_PORT
            - name: DB_PRIMARY_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_PRIMARY_NAME
            - name: DB_PRIMARY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_PRIMARY_USER
            - name: DB_PRIMARY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "catalog-service.fullname" . }}
                  key: DB_PRIMARY_PASSWORD
      restartPolicy: Never
{{- end }}
