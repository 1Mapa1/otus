{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "catalog-service.fullname" . }}
  labels:
    {{- include "catalog-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
data:
  DB_PRIMARY_HOST: {{ .Values.global.catalogDbPrimaryHost }}
  DB_PRIMARY_PORT: {{ .Values.global.catalogDbPort | quote }}
  DB_PRIMARY_NAME: {{ .Values.dbName }}
  DB_REPLICA_HOST: {{ .Values.global.catalogDbReplicaHost }}
  DB_REPLICA_PORT: {{ .Values.global.catalogDbPort | quote }}
  DB_REPLICA_NAME: {{ .Values.dbName }}
  ASPNETCORE_ENVIRONMENT: {{ .Values.global.environment }}
  Auth__Url: {{ default (include "catalog-service.authServiceUrl" .) .Values.config.authUrlOverride | quote }}
  Redis__Configuration: {{ default (include "catalog-service.redisConfigurationDefault" .) .Values.config.redisConfigurationOverride | quote }}
  Redis__InstanceName: {{ .Values.config.redisInstanceName | quote }}
  Kafka__BootstrapServers: {{ default (include "catalog-service.kafkaBootstrapServersDefault" .) .Values.global.kafkaBootstrapServers | quote }}
  Kafka__GroupId: {{ .Values.config.kafkaGroupId | quote }}
  {{- range $i, $topic := .Values.config.kafkaTopics }}
  Kafka__Topics__{{ $i }}: {{ $topic | quote }}
  {{- end }}
  Kafka__Acks: {{ .Values.config.kafkaAcks | quote }}
  Kafka__EnableIdempotence: {{ .Values.config.kafkaEnableIdempotence | quote }}
  Catalog__LowStockThreshold: {{ .Values.config.lowStockThreshold | quote }}
  Catalog__BrandsCacheTtl: {{ .Values.config.brandsCacheTtl | quote }}
  Catalog__CategoriesCacheTtl: {{ .Values.config.categoriesCacheTtl | quote }}
{{- end }}
