global:
  umbrellaChartName: homework-apps
  kubernetesAppName: homework-apps
  peerAuthName: auth
  clusterDomain: cluster.local
  secretType: Opaque
  dbHost: postgres-postgresql
  dbPort: "5432"
  environment: Development

enabled: true
name: billing
dbName: billing_db

deployment:
  imageRepository: maslovdeveloper/hwapp-billing-service
  imageTag: "10.3"
  replicaCount: 2
  maxSurge: 1
  maxUnavailable: 1
  port: 8000
  protocol: TCP
  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 12
  readinessProbe:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

service:
  type: ClusterIP
  port: 80
  protocol: TCP
  name: http
  monitor:
    enabled: true
    port: 8080
    protocol: TCP
    name: monitor

serviceMonitor:
  enabled: true
  scrapeTimeout: 30s
  honorLabels: true
  path: /metrics

migrationJob:
  enabled: true
  ttlSecondsAfterFinished: 100
  backoffLimit: 3
  imageRepository: maslovdeveloper/hwapp-billing-migration
  imageTag: "8.0"

config:
  authUrlOverride: ""
  kafkaGroupId: billing-service
  kafkaTopics:
    - auth
  kafkaDlqTopic: billing.dlq
  kafkaMaxRetryAttempts: 5
  kafkaRetryDelaySeconds: 5

secret:
  dbUser: billing_user
  dbPassword: billing_pass
