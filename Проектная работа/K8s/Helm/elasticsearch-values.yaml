clusterName: elasticsearch
replicas: 1
minimumMasterNodes: 1
protocol: http
clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false

createCert: false
secret:
  enabled: true
  # Required by the chart readiness script even when xpack security is disabled.
  password: "demo-elastic-password"

esJavaOpts: "-Xms1g -Xmx1g"

resources:
  requests:
    cpu: "500m"
    memory: "1536Mi"
  limits:
    cpu: "1000m"
    memory: "1536Mi"

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 3Gi

service:
  type: ClusterIP

antiAffinity: "soft"
